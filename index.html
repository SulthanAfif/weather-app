<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather App</h1>
            <div class="header-actions">
                <button id="unitToggle" class="unit-btn" title="Ganti satuan">°C</button>
                <button id="darkModeToggle" class="dark-mode-btn">🌙</button>
            </div>
        </header>

        <form id="searchForm">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Cari kota..." 
                autocomplete="off"
                required
            >
            <button type="submit">Cari</button>
            <button type="button" id="locationBtn" title="Gunakan lokasi saya">📍</button>
        </form>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Memuat data cuaca...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <!-- Current Weather -->
        <div id="weatherCard" class="weather-card hidden">
            <div class="weather-header">
                <h2 id="cityName">-</h2>
                <p id="date">-</p>
            </div>

            <div class="weather-main">
                <img id="weatherIcon" src="" alt="Weather Icon">
                <div class="temp-box">
                    <h1 id="temperature">-</h1>
                    <p id="description">-</p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="label">Terasa</span>
                    <span id="feelsLike">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">Kelembapan</span>
                    <span id="humidity">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">Angin</span>
                    <span id="wind">-</span>
                </div>
                <div class="detail-item">
                    <span class="label">Tekanan</span>
                    <span id="pressure">-</span>
                </div>
            </div>
        </div>

        <!-- 5 Day Forecast -->
        <div id="forecastSection" class="forecast-section hidden">
            <h3>Prakiraan 5 Hari</h3>
            <div id="forecastList" class="forecast-list"></div>
        </div>

        <!-- History -->
        <div id="historySection" class="history hidden">
            <h3>Pencarian Terakhir</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
